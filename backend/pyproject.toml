[project]
name = "codebuddy-backend"
version = "0.1.0"
description = "CodeBuddy - AI-powered coding portfolio tracker (backend)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pyjwt>=2.8.0",
    "apscheduler>=3.10.4",
    "fpdf2>=2.7.9",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.0",
    "langchain-chroma>=1.0.0",
    "chromadb>=1.0.0",
]

[tool.uv]
package = false
